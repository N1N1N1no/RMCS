rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::MotorTestDouble -> motor_test_double
      - rmcs_core::controller::MotorTestDoubleController -> motor_test_double_controller
      - rmcs_core::controller::pid::PidController -> angle_pid_controller
      - rmcs_core::controller::pid::PidController -> velocity_pid_controller
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

motor_test_double:
  ros__parameters:
    board_serial: ""          

motor_test_double_controller:
  ros__parameters:
    square_wave_enabled: true  # 启用方波目标角度（调试）
    target_angle_amplitude: 3.0 # 方波幅值(rad)
    square_wave_period: 3.0     # 方波半周期(秒)
    target_angle: 0.0           # 方波关闭(square_wave_enabled=false)时的固定目标位置(rad)
    angle_filter_cutoff: 0.0    
    velocity_filter_cutoff: 100.0  
    filter_sampling_frequency: 1000.0  

angle_pid_controller:
  ros__parameters:
    setpoint: /test/motor/target_angle      
    measurement: /test/motor/angle 
    feedforward: 0.0
    control: /test/motor/control_velocity   # 角度环输出：目标速度(rad/s)，供速度环 setpoint
    kp: 3.88             # 角度环(位置环) P
    ki: 0.015               # 角度环 I
    kd: 0.0085              # 角度环 D
    output_min: -30.0      # 角度环输出的最大目标速度下限(rad/s)
    output_max: 30.0       # 角度环输出的最大目标速度上限(rad/s)
    integral_min: -6.0    
    integral_max: 6.0     

velocity_pid_controller:
  ros__parameters:
    setpoint: /test/motor/control_velocity      # 目标速度
    measurement: /test/motor/velocity  # 滤波后速度
    feedforward: 0.0
    control: /test/motor/control_torque        
    kp: 0.035            
    ki: 0.0015               
    kd: 0.0              
    integral_min: -18.0    # 速度环积分限幅下限
    integral_max: 18.0     # 速度环积分限幅上限

value_broadcaster:
  ros__parameters:
    forward_list:
      - /test/motor/angle
      - /test/motor/measured_angle
      - /test/motor/measured_velocity
      - /test/motor/target_angle
      - /test/motor/angle_error
      - /test/motor/control_velocity
      - /test/motor/control_torque
      - /test/motor/velocity
      - /test/motor/torque