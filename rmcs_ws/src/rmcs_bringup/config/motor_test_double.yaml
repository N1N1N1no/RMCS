# motor_test_double 单 M3508 电机（C 板）角度环+速度环双环位置控制（未启用 DR16）
# 启动: ros2 launch rmcs_bringup rmcs.launch.py robot:=motor_test_double
# 调试: 默认用方波作为目标角度：在 ±target_angle_amplitude(rad) 之间每 square_wave_period 秒切换一次，
#       用于观察位置环的阶跃响应/跟踪效果。
# 可视化: 先启动 foxglove bridge(.script/foxglove)，Foxglove Plot 中看：
#         /test/motor/angle         实际角度(rad)
#         /test/motor/target_angle  目标角度(rad，方波)
#         /test/motor/angle_error   角度误差(rad)

rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::MotorTestDouble -> motor_test_double
      - rmcs_core::controller::MotorTestDoubleController -> motor_test_double_controller
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

motor_test_double:
  ros__parameters:
    board_serial: ""          # C 板 USB 串口序列号过滤（留空自动匹配）

motor_test_double_controller:
  ros__parameters:
    square_wave_enabled: false   # 启用方波目标角度（调试）
    target_angle_amplitude: 0.5 # 方波幅值(rad)：目标在 -0.5 和 +0.5 之间切换
    square_wave_period: 2.0     # 方波半周期(秒)：约每 2 秒切换一次
    target_angle: 0.0           # 方波关闭(square_wave_enabled=false)时的固定目标位置(rad)
    angle_filter_cutoff: 0.0    # 角度反馈低通滤波截止频率(Hz)，<=0 关闭
    velocity_filter_cutoff: 100.0  # 速度反馈低通滤波截止频率(Hz)，<=0 关闭
    filter_sampling_frequency: 1000.0  # 滤波采样频率，应与 update_rate 一致
    max_velocity: 5.0           # 位置环输出的最大目标速度(rad/s)
    angle_kp: 15.0               # 角度环(位置环) P
    angle_ki: 0.0              # 角度环 I
    angle_kd: 0.0              # 角度环 D
    vel_kp: 1.16             # 速度环 P
    vel_ki: 0.1                 # 速度环 I
    vel_kd: 0.0               # 速度环 D
    integral_limit: 1.0         # 速度环积分限幅

value_broadcaster:
  ros__parameters:
    forward_list:
      - /test/motor/angle
      - /test/motor/target_angle
      - /test/motor/angle_error
      - /test/motor/velocity
      - /test/motor/torque
