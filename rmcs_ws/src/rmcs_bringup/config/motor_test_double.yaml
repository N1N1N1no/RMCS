rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::MotorTestDouble -> motor_test_double
      - rmcs_core::controller::MotorTestDoubleController -> motor_test_double_controller
      - rmcs_core::controller::pid::PidController -> angle_pid_controller
      - rmcs_core::controller::pid::PidController -> velocity_pid_controller
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

motor_test_double:
  ros__parameters:
    board_serial: ""          

motor_test_double_controller:
  ros__parameters:
    trapezoid_enabled: false    # 启用梯形波目标角度（调试）
    target_angle_amplitude: 3.0 # 梯形波幅值(rad)
    trapezoid_rise_time: 2.0    # 斜坡时间(秒)
    trapezoid_hold_time: 2.0    # 保持时间(秒)
    target_angle: 2.0           # 波形关闭时的固定目标位置(rad)



    major_arc_enabled: true    # true=走优弧；false=保持原来的直接跟踪 target_angle
    major_arc_tolerance: 0.05   

    # 只要左摇杆偏离中位（超过死区），目标角度就设定为 remote_angle_setpoint(rad)；回中则给定 0。
    # 与 major_arc_enabled 组合：每次拨动/回中都会触发一次优弧运动（需 trapezoid_enabled=false）。
    remote_angle_enabled: true          # true=用左摇杆给定目标角度
    remote_angle_setpoint: 3.0           # 拨动左摇杆时给定的目标角度(rad)，0 < 值 ≤ π
    remote_angle_deadband: 0.1           

    angle_filter_cutoff: 0.0    
    velocity_filter_cutoff: 100.0  
    filter_sampling_frequency: 1000.0  

angle_pid_controller:
  ros__parameters:
    setpoint: /test/motor/target_angle      
    measurement: /test/motor/angle 
    feedforward: 0.0
    control: /test/motor/control_velocity   
    kp: 5.5            
    ki: 0.0               
    kd: 0.15              
    output_min: -100.0      
    output_max: 100.0       
    integral_min: -60.0    
    integral_max: 60.0     

velocity_pid_controller:
  ros__parameters:
    setpoint:  /test/motor/control_velocity      # 目标速度
    measurement: /test/motor/velocity  
    feedforward: 0.0
    control: /test/motor/control_torque        
    kp: 0.035            
    ki: 0.0015               
    kd: 0.0              
    integral_min: -18.0    
    integral_max: 18.0     
    output_min: -80.0      
    output_max: 80.0 

value_broadcaster:
  ros__parameters:
    forward_list:
      - /test/motor/angle
      - /test/motor/measured_angle
      - /test/motor/measured_velocity
      - /test/motor/target_angle
      - /test/motor/angle_error
      - /test/motor/control_velocity
      - /test/motor/control_torque
      - /test/motor/velocity
      - /test/motor/torque