rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::GantryFrame -> gantry_frame
      - rmcs_core::controller::GantryFrameController -> gantry_frame_controller
      - rmcs_core::controller::pid::PidController -> frame_left_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> frame_right_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> frame_yaw_velocity_pid_controller
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

gantry_frame:
  ros__parameters:
    board_serial: ""

gantry_frame_controller:
  ros__parameters:
    # 左摇杆 x 轴满量程对应的 pitch 电机目标速度，单位 rad/s。
    max_velocity: 15.0
    # 右摇杆 y 轴满量程对应的 yaw 电机目标速度，单位 rad/s。
    yaw_max_velocity: 15.0

frame_left_velocity_pid_controller:
  ros__parameters:
    setpoint: /test/frame_left_motor/target_velocity
    measurement: /test/frame_left_motor/velocity
    feedforward: 0.0
    control: /test/frame_left_motor/control_torque
    kp: 0.08
    ki: 0.0
    kd: 0.0
    integral_min: -10.0
    integral_max: 10.0
    output_min: -1.8
    output_max: 1.8

frame_right_velocity_pid_controller:
  ros__parameters:
    setpoint: /test/frame_right_motor/target_velocity
    measurement: /test/frame_right_motor/velocity
    feedforward: 0.0
    control: /test/frame_right_motor/control_torque
    kp: 0.08
    ki: 0.0
    kd: 0.0
    integral_min: -10.0
    integral_max: 10.0
    output_min: -1.8
    output_max: 1.8

frame_yaw_velocity_pid_controller:
  ros__parameters:
    setpoint: /test/frame_yaw_motor/target_velocity
    measurement: /test/frame_yaw_motor/velocity
    feedforward: 0.0
    control: /test/frame_yaw_motor/control_torque
    kp: 0.08
    ki: 0.0
    kd: 0.0
    integral_min: -10.0
    integral_max: 10.0
    output_min: -1.8
    output_max: 1.8

value_broadcaster:
  ros__parameters:
    forward_list:
      - /test/frame_left_motor/velocity
      - /test/frame_left_motor/torque
      - /test/frame_left_motor/target_velocity
      - /test/frame_left_motor/control_torque
      - /test/frame_right_motor/velocity
      - /test/frame_right_motor/torque
      - /test/frame_right_motor/target_velocity
      - /test/frame_right_motor/control_torque
      - /test/frame_yaw_motor/velocity
      - /test/frame_yaw_motor/torque
      - /test/frame_yaw_motor/target_velocity
      - /test/frame_yaw_motor/control_torque
