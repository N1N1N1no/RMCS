# motor_test 单 M3508 电机（C 板）直给目标速度 + PID
# 说明: 未接 DR16/遥控器；控制器始终使能，让电机转速收敛到 target_velocity。
#       需要停转时把 target_velocity 改为 0 或直接 Ctrl+C。

rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::MotorTest -> motor_test
      - rmcs_core::controller::MotorTestController -> motor_test_controller

motor_test:
  ros__parameters:
    board_serial: ""          # C 板 USB 串口序列号过滤（留空自动匹配）

motor_test_controller:
  ros__parameters:
    target_velocity: 2.0     # 直接给定的目标角速度(rad/s)，正负代表方向，0 即停转
    kp: 0.5                  # 速度环比例
    ki: 0.0                  # 速度环积分（有静差时可加大）
    kd: 0.0                  # 速度环微分
    integral_limit: 1.0      # 积分限幅
