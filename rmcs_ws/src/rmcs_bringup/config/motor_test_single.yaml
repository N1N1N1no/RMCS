rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::MotorTestSingle -> motor_test_single
      - rmcs_core::controller::MotorTestSingleController -> motor_test_single_controller
      - rmcs_core::controller::pid::PidController -> velocity_pid_controller
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

motor_test_single:
  ros__parameters:
    board_serial: ""          

motor_test_single_controller:
  ros__parameters:
    fixed_velocity_enabled: false
    target_velocity: 20.0
    max_velocity: 50.0
    velocity_filter_cutoff: 100.0      # 速度反馈低通滤波截止频率
    filter_sampling_frequency: 1000.0  # 滤波采样频率

velocity_pid_controller:
  ros__parameters:
    setpoint: /test/motor/target_velocity      # 来自 motor_test_single_controller 的目标速度
    measurement: /test/motor/measured_velocity  # 来自 motor_test_single_controller 的滤波后速度
    feedforward: 0.0
    control: /test/motor/control_torque         # 速度环输出：力矩，供硬件读取
    kp: 0.3               # 速度环 P
    ki: 0.005             # 速度环 I
    kd: 0.0               # 速度环 D
    integral_min: -10.0   # 速度环积分限幅下限
    integral_max: 10.0    # 速度环积分限幅上限
    output_min: -50.0     # 速度环输出限幅下限
    output_max: 50.0      # 速度环输出限幅上限

value_broadcaster:
  ros__parameters:
    forward_list:
      - /test/motor/velocity
      - /test/motor/measured_velocity
      - /test/motor/target_velocity
      - /test/motor/velocity_error
      - /test/motor/control_torque
      - /test/motor/torque
